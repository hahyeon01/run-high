name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: 디버그 APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 웹 빌드 (데모 모드: 서버 없이 기기 안에서 동작)
        run: npm run build -w @runhigh/web

      - name: Capacitor 동기화
        working-directory: apps/web
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle 빌드
        working-directory: apps/web/android
        env:
          RUNHIGH_VERSION_CODE: ${{ github.run_number }}
          RUNHIGH_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK 정리
        run: |
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk runhigh-debug.apk
          ls -la runhigh-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: runhigh-apk
          path: runhigh-debug.apk
          retention-days: 30

      - name: '"latest" 릴리스에 APK 올리기'
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest runhigh-debug.apk \
            --target "${GITHUB_SHA}" \
            --title "런하이 Android 최신 빌드 (#${{ github.run_number }})" \
            --notes "main 브랜치 커밋 ${GITHUB_SHA::7} 에서 자동으로 만든 디버그 APK예요.
          - 설치: 휴대폰에서 runhigh-debug.apk 를 내려받아 열고, '출처를 알 수 없는 앱' 설치를 허용해 주세요.
          - 기본은 데모 모드(서버 없이 기기 안에 저장)예요. 설정 → 연결에서 런하이 서버 주소를 넣으면 서버 모드로 바뀌어요.
          - 같은 키로 서명해 다음 빌드도 그대로 덮어 설치할 수 있어요."
