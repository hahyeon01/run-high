name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 타입 검사 · 단위 테스트 · 빌드 · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사 (core · server · web)
        run: npm run typecheck

      - name: 단위·통합 테스트 (레벨 산출, 자격 판정, 신뢰 점수, 서비스, API 서버)
        run: npm test

      - name: 빌드 (웹 + 서버)
        run: npm run build

      - name: Playwright 브라우저 설치
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: E2E (데모 모드 웹앱의 실제 사용자 흐름)
        working-directory: apps/web
        run: npx playwright test
        env:
          CI: 'true'

      - name: E2E 리포트 보관 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
